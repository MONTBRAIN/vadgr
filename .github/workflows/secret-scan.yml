name: secret-scan

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]
  push:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Reject credentials in commits and GitHub text
        shell: bash
        run: |
          ARGS=(--event-file "$GITHUB_EVENT_PATH")
          # The range to scan. On a push it starts at the commit the branch used
          # to point at, and **a force push makes that commit unreachable**, so
          # the range cannot be resolved and the gate exits 2. That is the gate
          # refusing rather than passing, which is right, but the cause is a
          # rebase rather than a credential, and a gate that goes red for that
          # teaches everyone to ignore it. So an unresolvable start falls back to
          # the repository's default branch, which scans more rather than less.
          START=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            START="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            START="${{ github.event.before }}"
          fi
          if [ -n "$START" ]; then
            if ! git cat-file -e "$START^{commit}" 2>/dev/null; then
              DEFAULT="${{ github.event.repository.default_branch }}"
              echo "start commit $START is unreachable (a force push); scanning from origin/$DEFAULT instead"
              START="$(git rev-parse "origin/$DEFAULT")"
            fi
            ARGS+=(--git-range "$START..${{ github.sha }}")
          fi
          python3 scripts/check_no_secrets.py "${ARGS[@]}"
      # The same range and the same event, checked for a different thing: a
      # credit to a tool. The rule predates this step and was still broken, by
      # five commits on a release branch, which is why it is a step rather than
      # a sentence.
      - name: Reject AI attribution in commits and GitHub text
        shell: bash
        run: |
          ARGS=(--event-file "$GITHUB_EVENT_PATH")
          START=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            START="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            START="${{ github.event.before }}"
          fi
          if [ -n "$START" ]; then
            if ! git cat-file -e "$START^{commit}" 2>/dev/null; then
              DEFAULT="${{ github.event.repository.default_branch }}"
              echo "start commit $START is unreachable (a force push); scanning from origin/$DEFAULT instead"
              START="$(git rev-parse "origin/$DEFAULT")"
            fi
            ARGS+=(--git-range "$START..${{ github.sha }}")
          fi
          python3 scripts/check_no_ai_attribution.py "${ARGS[@]}"
      # A branch cut from another branch carries that branch's commits, and a
      # squash merge replays the whole diff, so merging it merges the other work
      # too. Ancestry is the signal, and it needs the pull request list.
      # README.md is the file most people read and the one nobody remembers to
      # open. It was wrong in all three repositories at once, for three minors,
      # and nothing failed. A version that moves alone is the shape all three had.
      - name: A release touches its README, or says it did not
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python3 scripts/check_readme_touched.py \
            --git-range "${{ github.event.pull_request.base.sha }}..${{ github.sha }}" \
            --event-file "$GITHUB_EVENT_PATH"

      - name: Reject a branch cut from another branch
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_branch_point.py --pr-number "${{ github.event.pull_request.number }}"

      # Evidence reached the default branch once inside a pull request that was
      # adding something else, because a `git add -A` swept a thrown-away pass
      # along with it. Evidence is the record a release rests on, so it gets its
      # own change and every pass names the build behind it.
      - name: Reject evidence that rides along or cannot name its build
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python3 scripts/check_evidence.py \
            --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  # The gate itself had no test and ran on one operating system, so its Windows
  # DACL control was never executed anywhere. It refused every file it was given
  # for as long as that lasted, and nothing reported it.
  gate-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Test the credential gate
        run: python -m pytest scripts/tests -q
