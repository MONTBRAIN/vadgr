[package]
name = "vadgr-daemon"
version = "0.4.7"
edition = "2024"
description = "The vadgr machine daemon"

[lib]
name = "vadgr_daemon"
path = "src/lib.rs"

[[bin]]
name = "vadgr-daemon"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["trace"] }
# Bundled so the four platforms stop each bringing their own SQLite. This
# removes a platform variable from the migration; it does not touch a column,
# which is what the schema freeze actually forbids.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml is unmaintained and its own release is tagged "+deprecated".
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
sha2 = "0.11"
rand = "0.10"
futures-util = "0.3"
anyhow = "1"
hostname = "0.4"
async-trait = "0.1"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls", "stream"] }
rustls = { version = "0.23", default-features = false }
webpki-roots = "1"
rmcp = { version = "3.1", default-features = false, features = ["client", "transport-child-process"] }
thiserror = "2"
tokio-util = "0.7"
base64 = "0.23"
directories = "6"
url = "2.5"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
