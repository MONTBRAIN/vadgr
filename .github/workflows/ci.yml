name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Note: the `computer_use/` module was extracted into
  # https://github.com/MONTBRAIN/vadgr-computer-use and is consumed as a
  # PyPI package. Its tests run in that repo's CI. This workflow only
  # tests modules that still live here.

  # ----- api module -----
  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for api changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE=${{ github.event.before }}
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^api/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python ${{ matrix.python-version }}
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        if: steps.changes.outputs.changed == 'true'
        run: pip install -r api/requirements.txt

      - name: Run tests with coverage
        if: steps.changes.outputs.changed == 'true'
        env:
          PYTHONPATH: .
        run: python -m pytest api/tests/ -v --cov=api --cov-report=term-missing

      - name: Skip (no changes)
        if: steps.changes.outputs.changed == 'false'
        run: echo "No api/ changes -- skipping tests."

  # ----- engine module -----
  engine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for engine changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE=${{ github.event.before }}
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^engine/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python ${{ matrix.python-version }}
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        if: steps.changes.outputs.changed == 'true'
        run: pip install -r engine/requirements.txt

      - name: Run tests with coverage
        if: steps.changes.outputs.changed == 'true'
        env:
          PYTHONPATH: .
        run: python -m pytest engine/tests/ -v --cov=engine --cov-report=term-missing

      - name: Skip (no changes)
        if: steps.changes.outputs.changed == 'false'
        run: echo "No engine/ changes -- skipping tests."

  # ----- cli module -----
  cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for cli changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE=${{ github.event.before }}
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^cli/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python ${{ matrix.python-version }}
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        if: steps.changes.outputs.changed == 'true'
        run: pip install -r cli/requirements.txt

      - name: Run tests with coverage
        if: steps.changes.outputs.changed == 'true'
        env:
          PYTHONPATH: .
        run: python -m pytest cli/tests/ -v --cov=cli --cov-report=term-missing

      - name: Skip (no changes)
        if: steps.changes.outputs.changed == 'false'
        run: echo "No cli/ changes -- skipping tests."

  # ----- the rust daemon -----
  # The crate is judged here rather than only on a developer's machine: from
  # 0.4.5 the daemon is being rewritten beside the Python one, and a suite that
  # only ever runs locally is a suite that stops running.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build
        working-directory: rust
        run: cargo build --locked
      - name: Test
        working-directory: rust
        run: cargo test --locked
      - name: Lint
        working-directory: rust
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Format
        working-directory: rust
        run: cargo fmt --all -- --check

  clean-install:
    # Build the delivered artifact, then prove it from outside a scratch image
    # that contains the binary and nothing else.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install the musl linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-targets: false
          shared-key: clean-install-musl
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: Build the static release binary
        working-directory: rust
        run: cargo build --locked --release --target x86_64-unknown-linux-musl --bin vadgr-daemon
      - name: Verify the release binary is static
        run: |
          file rust/target/x86_64-unknown-linux-musl/release/vadgr-daemon
          file rust/target/x86_64-unknown-linux-musl/release/vadgr-daemon | grep -Eq 'static(-pie)? linked'
      - name: Install only the binary in scratch and prove readiness
        working-directory: rust
        env:
          VADGR_RELEASE_BINARY: target/x86_64-unknown-linux-musl/release/vadgr-daemon
        run: cargo test --locked --test clean_install installed_release_starts_and_serves -- --ignored --exact --nocapture
