name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Desktop automation lives in https://github.com/MONTBRAIN/vadgr-computer-use
  # and is consumed as a package; its tests run in that repository's CI.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check

  # The installer is the first thing a new user runs, and it had never been
  # executed by a pipeline: the clean-install job below proves the artifact, not
  # the script that puts the artifact on a machine.
  #
  # It runs on every platform the product claims, because an installer proved on
  # one operating system says nothing about the others. Two Windows only test
  # failures in the 0.4.9 pass are the argument.
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux gets a container with nothing in it, which is the only place
          # a truly clean machine is available to us.
          - os: ubuntu-latest
            shell: bash
          - os: windows-latest
            shell: pwsh
          - os: macos-latest
            shell: bash
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The hosted Windows and macOS images ship a Rust toolchain, so a clean
      # machine has to be made rather than found: each step below takes the
      # toolchain off PATH and then asserts it is gone, which is what makes the
      # claim real rather than assumed. The installer installs its own.
      - name: Install on Linux, in a container with nothing in it
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/src:ro" -e VADGR_REF="$GITHUB_SHA" debian:12-slim bash -eu -c '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends ca-certificates curl git build-essential
            ! command -v cargo
            ! command -v vadgr
            git config --global --add safe.directory '*'
            VADGR_REPO_URL=/src bash /src/install.sh
            export PATH="$HOME/.vadgr/bin:$PATH"
            command -v vadgr | grep -q "^$HOME/.vadgr/bin/vadgr$"
            command -v vadgr-daemon | grep -q "^$HOME/.vadgr/bin/vadgr-daemon$"
            vadgr --version
            # Nothing is started, so the daemon is down and saying so is the
            # correct answer. Exit 3 is that answer, and it is a contract.
            set +e; vadgr health; code=$?; set -e
            test "$code" -eq 3 || { echo "expected exit 3 from a stopped daemon, got $code"; exit 1; }
          '

      - name: Install on macOS, with the runner's toolchain out of the way
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          VADGR_REPO_URL: ${{ github.workspace }}
          VADGR_REF: ${{ github.sha }}
        run: |
          # Remove whatever directory actually provides cargo, however it got
          # there, rather than guessing at its name. A name based filter missed
          # the runner's own location and the assertion below caught it.
          for _ in 1 2 3 4 5; do
            where="$(command -v cargo || true)"
            [ -n "$where" ] || break
            dir="$(dirname "$(readlink -f "$where")")"
            export PATH="$(echo "$PATH" | tr ':' '\n' | grep -vxF "$dir" | grep -vxF "$(dirname "$where")" | paste -sd:)"
            hash -r
          done
          ! command -v cargo || { echo "the runner still has cargo at $(command -v cargo)"; exit 1; }
          bash install.sh
          export PATH="$HOME/.vadgr/bin:$PATH"
          command -v vadgr | grep -q "^$HOME/.vadgr/bin/vadgr$"
          vadgr --version
          set +e; vadgr health; code=$?; set -e
          test "$code" -eq 3 || { echo "expected exit 3 from a stopped daemon, got $code"; exit 1; }

      - name: Install on Windows, through the PowerShell half
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          VADGR_REPO_URL: ${{ github.workspace }}
          VADGR_REF: ${{ github.sha }}
        run: |
          # Remove whatever directory actually provides cargo, however it got
          # there, rather than guessing at its name.
          for ($i = 0; $i -lt 5; $i++) {
            $found = Get-Command cargo -ErrorAction SilentlyContinue
            if (-not $found) { break }
            $dir = Split-Path -Parent $found.Source
            $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -ne $dir }) -join ';'
          }
          if (Get-Command cargo -ErrorAction SilentlyContinue) { throw "the runner still has cargo at $((Get-Command cargo).Source)" }
          .\install.ps1
          $env:PATH = "$env:USERPROFILE\.vadgr\bin;$env:PATH"
          $resolved = (Get-Command vadgr).Source
          if ($resolved -ne "$env:USERPROFILE\.vadgr\bin\vadgr.exe") { throw "vadgr resolved to $resolved" }
          vadgr --version
          # Exit 3 with nothing started is the contract, on this platform too.
          vadgr health
          if ($LASTEXITCODE -ne 3) { throw "expected exit 3 from a stopped daemon, got $LASTEXITCODE" }

  clean-install:
    # Build the delivered artifact, then prove it from outside a scratch image
    # that contains the binary and nothing else.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install the musl linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          shared-key: clean-install-musl
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: Build the static release binary
        run: cargo build --locked --release --target x86_64-unknown-linux-musl --bin vadgr-daemon
      - name: Verify the release binary is static
        run: |
          file target/x86_64-unknown-linux-musl/release/vadgr-daemon
          file target/x86_64-unknown-linux-musl/release/vadgr-daemon | grep -Eq 'static(-pie)? linked'
      - name: Install only the binary in scratch and prove readiness
        env:
          VADGR_RELEASE_BINARY: target/x86_64-unknown-linux-musl/release/vadgr-daemon
        run: cargo test --locked --test clean_install installed_release_starts_and_serves -- --ignored --exact --nocapture
