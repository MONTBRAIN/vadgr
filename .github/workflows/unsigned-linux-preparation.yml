name: Prepare unsigned Linux development package

on:
  push:
    branches: [feature/0.5.0-distribution]
    paths:
      - '.github/workflows/unsigned-linux-preparation.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'src/**'
      - 'packaging/**'
      - 'scripts/prepare_unsigned_linux.py'
      - 'scripts/verify_appimage_runtime.py'
      - 'scripts/check_linux_build_policy.py'
      - 'scripts/cua_wheelhouse.py'
      - 'scripts/validate_package_inputs.py'
      - 'scripts/distribution_matrix.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: unsigned-linux-development-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'MONTBRAIN/vadgr' && github.ref == 'refs/heads/feature/0.5.0-distribution'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-gnu
      - name: Prepare the registered native builder
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = X64
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libudev-dev libdbus-1-dev libssl-dev pkg-config binutils squashfs-tools
          python -m pip install 'packaging==25.0'
      - name: Materialize exact reviewed wheels with read-only access
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cua_wheelhouse.py --source . --target x86_64-unknown-linux-gnu --release-profile linux-x86_64 --out "$RUNNER_TEMP/linux-wheelhouse"
      - name: Compile and prepare without GitHub or signing credentials
        id: preparation
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_unsigned_linux.py prepare --source-commit "$SOURCE_COMMIT" --architecture x86_64 --wheelhouse "$RUNNER_TEMP/linux-wheelhouse" --preparation "$RUNNER_TEMP/linux-prepared"
          python -c 'from pathlib import Path; import os; from scripts.prepare_unsigned_linux import require_release_abi; print(require_release_abi(Path(os.environ["RUNNER_TEMP"]) / "linux-prepared/vadgr"))'
      - name: Build the registered vehicle when its reviewed inputs exist
        id: package
        if: ${{ hashFiles('packaging/inputs/linux-x86_64/package-input-review.json') != '' }}
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tool_id=$(python -c 'import json; print(json.load(open("packaging/toolchain.json"))["appimagetool"]["x86_64"]["asset_id"])')
          runtime_id=$(python -c 'import json; print(json.load(open("packaging/linux/runtime.json"))["targets"]["x86_64"]["asset_id"])')
          curl --fail --location --proto '=https' --tlsv1.2 -H 'Accept: application/octet-stream' "https://api.github.com/repos/AppImage/appimagetool/releases/assets/$tool_id" -o "$RUNNER_TEMP/appimagetool"
          curl --fail --location --proto '=https' --tlsv1.2 -H 'Accept: application/octet-stream' "https://api.github.com/repos/AppImage/type2-runtime/releases/assets/$runtime_id" -o "$RUNNER_TEMP/appimage-runtime"
          chmod 755 "$RUNNER_TEMP/appimagetool"
          python scripts/prepare_unsigned_linux.py package --source-commit "$SOURCE_COMMIT" --architecture x86_64 --preparation "$RUNNER_TEMP/linux-prepared" --appimagetool "$RUNNER_TEMP/appimagetool" --runtime "$RUNNER_TEMP/appimage-runtime"
      - name: Retain exact development observations without claiming E2E
        id: retain
        if: ${{ always() && steps.preparation.outcome == 'success' }}
        env:
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/linux-retained"
          tar -C "$RUNNER_TEMP/linux-prepared" -czf "$RUNNER_TEMP/linux-retained/preparation.tar.gz" .
          cp "$RUNNER_TEMP/linux-prepared/preparation.json" "$RUNNER_TEMP/linux-retained/"
          if test "$PACKAGE_OUTCOME" = success; then
            test -f target/package/Vadgr-0.5.0-linux-x86_64-installer.AppImage
            test -f target/package/Vadgr-0.5.0-linux-x86_64-installer.development.json
            cp target/package/Vadgr-0.5.0-linux-x86_64-installer.AppImage target/package/Vadgr-0.5.0-linux-x86_64-installer.development.json "$RUNNER_TEMP/linux-retained/"
          else
            echo "Preparation only: package step outcome=$PACKAGE_OUTCOME; no vehicle qualification is claimed."
          fi
          cd "$RUNNER_TEMP/linux-retained"
          sha256sum preparation.tar.gz preparation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.retain.outcome == 'success' }}
        with:
          name: unsigned-linux-x86_64-development-${{ github.sha }}
          path: ${{ runner.temp }}/linux-retained/
          if-no-files-found: error
          retention-days: 30
