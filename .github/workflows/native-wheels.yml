name: Native dependency wheels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: build-windows
    if: github.ref == 'refs/heads/master' && github.run_attempt == 1
    runs-on: windows-11-arm
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          targets: aarch64-pc-windows-msvc
      - name: Build and test the reviewed native dependency
        shell: pwsh
        run: |
          python scripts/build_native_wheels.py --target windows-aarch64 --work "$env:RUNNER_TEMP/native-wheel-work" --out "$env:RUNNER_TEMP/native-wheel-output"
          if ($LASTEXITCODE -ne 0) { throw 'Native dependency build failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-wheel-windows-aarch64
          path: ${{ runner.temp }}/native-wheel-output/
          if-no-files-found: error
          retention-days: 90
      - name: Clean the isolated build tree
        if: always()
        shell: pwsh
        run: |
          $buildRoot = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'native-wheel-work'))
          $parentRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
          if (-not $buildRoot.StartsWith($parentRoot, [StringComparison]::OrdinalIgnoreCase)) { throw 'Unsafe cleanup root.' }
          if (Test-Path -LiteralPath $buildRoot) { Remove-Item -LiteralPath $buildRoot -Recurse -Force }

  build-macos:
    name: build-macos
    if: github.ref == 'refs/heads/master' && github.run_attempt == 1
    runs-on: macos-15-intel
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          targets: x86_64-apple-darwin
      - name: Build and test the reviewed native dependency
        run: python3 scripts/build_native_wheels.py --target macos-x86_64 --work "$RUNNER_TEMP/native-wheel-work" --out "$RUNNER_TEMP/native-wheel-output"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-wheel-macos-x86_64
          path: ${{ runner.temp }}/native-wheel-output/
          if-no-files-found: error
          retention-days: 90
      - name: Clean the isolated build tree
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          parent = Path(os.environ['RUNNER_TEMP']).resolve()
          target = (parent / 'native-wheel-work').resolve()
          if target.parent != parent or target.name != 'native-wheel-work':
              raise SystemExit('Unsafe cleanup root.')
          if target.exists():
              shutil.rmtree(target)
          PY

  validate-and-attest:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Independently validate the native wheel outputs
        run: python3 scripts/validate_native_wheels.py --out validated
      - name: Attest the exact validated wheel manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        id: manifest
        with:
          subject-path: validated/native-wheel-manifest.json
      - name: Retain the offline verification bundle
        env:
          MANIFEST_BUNDLE: ${{ steps.manifest.outputs.bundle-path }}
        run: |
          cp -- "$MANIFEST_BUNDLE" validated/native-wheel-manifest.json.bundle.jsonl
          gh attestation verify validated/native-wheel-manifest.json --repo MONTBRAIN/vadgr \
            --bundle validated/native-wheel-manifest.json.bundle.jsonl \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --signer-workflow MONTBRAIN/vadgr/.github/workflows/native-wheels.yml \
            --source-ref refs/heads/master --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          echo 'Dependency output only. Review exact manifest and wheel hashes before candidate use. No product signing or release occurred.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-wheels-validated
          path: validated/
          if-no-files-found: error
          retention-days: 90
