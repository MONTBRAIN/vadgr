name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Desktop automation lives in https://github.com/MONTBRAIN/vadgr-computer-use
  # and is consumed as a package; its tests run in that repository's CI.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check

  # The installer is the first thing a new user runs, and it had never been
  # executed by a pipeline: the clean-install job below proves the artifact, not
  # the script that puts the artifact on a machine.
  #
  # It runs on every platform the product claims, because an installer proved on
  # one operating system says nothing about the others. Two Windows only test
  # failures in the 0.4.9 pass are the argument.
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux gets a container with nothing in it, which is the only place
          # a truly clean machine is available to us.
          - os: ubuntu-latest
            shell: bash
          - os: windows-latest
            shell: pwsh
          - os: macos-latest
            shell: bash
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install on Linux, in a container with nothing in it
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/src:ro" -e VADGR_REF="$GITHUB_SHA" debian:12-slim bash -eu -c '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends ca-certificates curl git build-essential
            ! command -v cargo
            ! command -v vadgr
            git config --global --add safe.directory /src
            git config --global --add safe.directory /src/.git
            VADGR_REPO_URL=/src bash /src/install.sh
            export PATH="$HOME/.vadgr/bin:$PATH"
            command -v vadgr | grep -q "^$HOME/.vadgr/bin/vadgr$"
            command -v vadgr-daemon | grep -q "^$HOME/.vadgr/bin/vadgr-daemon$"
            vadgr --version
            # Nothing is started, so the daemon is down and saying so is the
            # correct answer. Exit 3 is that answer, and it is a contract.
            set +e; vadgr health; code=$?; set -e
            test "$code" -eq 3 || { echo "expected exit 3 from a stopped daemon, got $code"; exit 1; }
          '

      # The hosted macOS image ships a Rust toolchain and there is no container
      # to escape it, so this half proves what it can: that `install.sh` runs on
      # macOS and produces binaries that work there. The from nothing case is
      # the Linux half's, which has a container with nothing in it. Saying which
      # half proves which is the point; a job that implied both would be lying
      # about one.
      - name: Install on macOS, where the runner already has a toolchain
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          VADGR_REPO_URL: ${{ github.workspace }}
          VADGR_REF: ${{ github.sha }}
        run: |
          bash install.sh
          export PATH="$HOME/.vadgr/bin:$PATH"
          command -v vadgr | grep -q "^$HOME/.vadgr/bin/vadgr$"
          command -v vadgr-daemon | grep -q "^$HOME/.vadgr/bin/vadgr-daemon$"
          vadgr --version
          set +e; vadgr health; code=$?; set -e
          test "$code" -eq 3 || { echo "expected exit 3 from a stopped daemon, got $code"; exit 1; }

      # As above: the hosted Windows image ships a toolchain, so this half proves
      # that `install.ps1` runs on Windows and produces a working `vadgr.exe`.
      - name: Install on Windows, through the PowerShell half
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          VADGR_REPO_URL: ${{ github.workspace }}
          VADGR_REF: ${{ github.sha }}
        run: |
          .\install.ps1
          $env:PATH = "$env:USERPROFILE\.vadgr\bin;$env:PATH"
          $resolved = (Get-Command vadgr).Source
          if ($resolved -ne "$env:USERPROFILE\.vadgr\bin\vadgr.exe") { throw "vadgr resolved to $resolved" }
          vadgr --version
          # Exit 3 with nothing started is the contract, on this platform too.
          # The message goes to stderr, and this shell runs with a stop
          # preference that turns any native stderr into a terminating error, so
          # the exit code would never be read. Read it deliberately instead.
          $ErrorActionPreference = 'Continue'
          vadgr health 2>&1 | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 3) { throw "expected exit 3 from a stopped daemon, got $LASTEXITCODE" }
          # This shell exits with $LASTEXITCODE, which is the 3 just asserted, so
          # a passing check would fail the step on the very value it checked.
          exit 0

  # A clean install is a normal user's machine: it has the operating system and
  # the libraries the operating system ships, and it has no toolchain, no build
  # dependency and no trace of this product. The question is the same on every
  # platform, so it is one job with one matrix rather than a job per idea.
  #
  # It used to build a static musl binary for the Linux leg alone, which proved
  # an artifact no user was ever given while the installer shipped a different
  # one. Every leg now tests the binary a user actually gets.
  clean-install:
    strategy:
      fail-fast: false
      matrix:
        # macos-15 as well as the current image, because a binary built on a
        # newer macOS can silently require it, and an older supported release is
        # the nearest thing to a machine that did not build it.
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - name: Build the release binaries
        if: runner.os != 'Windows'
        run: cargo build --locked --release --bins

      # The C runtime is linked in rather than imported, so the binary does not
      # need the Visual C++ redistributable, which is not part of Windows. The
      # installer and `vadgr update` build the same way; an update that built
      # differently would replace a standalone binary with a dependent one.
      - name: Build the release binaries, with the C runtime linked in
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --release --bins --target x86_64-pc-windows-msvc

      # Linux has containers, so the machine can be made rather than approximated:
      # a base image with no toolchain, the binary copied in, nothing else.
      - name: Install it alone on a machine with no toolchain, and serve
        if: runner.os == 'Linux'
        env:
          VADGR_RELEASE_BINARY: target/release/vadgr-daemon
        run: cargo test --locked --test clean_install installed_release_starts_and_serves -- --ignored --exact --nocapture

      - name: What it links, and whether it serves with the toolchain out of reach
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          exe=target/release/vadgr-daemon
          test -x "$exe" || { echo "no binary at $exe"; exit 1; }
          otool -L "$exe"
          # Every library must be one macOS ships. Anything under /opt or
          # /usr/local is a dependency a user's machine may not have.
          libs="$(otool -L "$exe" | tail -n +2 | awk '{print $1}')"
          count="$(printf '%s\n' "$libs" | grep -c . || true)"
          test "$count" -ge 1 || { echo "read no linked libraries, which cannot be right"; exit 1; }
          echo "linked libraries: $count"
          bad=0
          while IFS= read -r lib; do
            [ -n "$lib" ] || continue
            case "$lib" in
              /usr/lib/*|/System/Library/*) ;;
              *) echo "links $lib, which macOS does not guarantee"; bad=1 ;;
            esac
          done <<< "$libs"
          test "$bad" -eq 0 || exit 1
          # The minimum macOS it will start on, recorded so a raised floor is
          # visible here rather than to someone on an older machine.
          vtool -show-build "$exe" 2>/dev/null | grep -E "minos|platform" || true
          root="$(mktemp -d)"
          env -i HOME="$root" \
            VADGR_STATE_HOME="$root/state" VADGR_PORT=8100 VADGR_TRANSPORT=loopback \
            "$PWD/$exe" > "$root/daemon.log" 2>&1 &
          body=""
          for _ in $(seq 1 40); do
            body="$(curl -fsS http://127.0.0.1:8100/api/health 2>/dev/null || true)"
            [ -n "$body" ] && break
            sleep 1
          done
          echo "$body"
          echo "$body" | grep -q '"status":"healthy"' || { cat "$root/daemon.log"; exit 1; }

      - name: What it imports, and whether it serves with the toolchain out of reach
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "target\x86_64-pc-windows-msvc\release\vadgr-daemon.exe"
          if (-not (Test-Path $exe)) { throw "no binary at $exe" }
          $dumpbin = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin not found on this runner" }
          $imports = & $dumpbin.FullName /dependents $exe |
            Select-String -Pattern '^\s+(\S+\.(dll|exe))$' |
            ForEach-Object { $_.Matches[0].Groups[1].Value.ToLower() } |
            Sort-Object -Unique
          $imports
          # A check that read nothing is not a check. This one inspected the
          # wrong path once and passed because the list was empty.
          if ($imports.Count -lt 3) { throw "read $($imports.Count) imports, which cannot be right" }
          # Every name here ships with Windows. vcruntime140.dll must never
          # appear: it belongs to the Visual C++ redistributable.
          $guaranteed = @('kernel32.dll','advapi32.dll','ntdll.dll','ws2_32.dll','user32.dll',
                          'bcrypt.dll','bcryptprimitives.dll','crypt32.dll','secur32.dll',
                          'userenv.dll','shell32.dll','ole32.dll','oleaut32.dll','combase.dll',
                          'powrprof.dll','psapi.dll','ncrypt.dll','ntoskrnl.exe','rpcrt4.dll',
                          'iphlpapi.dll','shlwapi.dll','version.dll','winmm.dll')
          foreach ($dll in $imports) {
            if ($guaranteed -notcontains $dll -and $dll -notlike 'api-ms-win-*') {
              throw "imports $dll, which Windows does not guarantee"
            }
          }
          $root = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
          New-Item -ItemType Directory -Path $root | Out-Null
          $daemon = Start-Process -PassThru -FilePath (Resolve-Path $exe) `
            -Environment @{ PATH=''; USERPROFILE=$root; LOCALAPPDATA=$root;
                            VADGR_STATE_HOME="$root\state"; VADGR_PORT='8100';
                            VADGR_TRANSPORT='loopback' } `
            -RedirectStandardOutput "$root\out.log" -RedirectStandardError "$root\err.log"
          $body = $null
          foreach ($i in 1..40) {
            try { $body = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8100/api/health).Content; break }
            catch { Start-Sleep -Seconds 1 }
          }
          $body
          if (-not $body -or $body -notmatch '"status":"healthy"') {
            Get-Content "$root\err.log" -ErrorAction SilentlyContinue
            throw "the binary did not serve health on its own"
          }
          Stop-Process -Id $daemon.Id -Force
          exit 0
