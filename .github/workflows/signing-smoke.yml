name: Isolated Windows one-file signing test

on:
  push:
    branches: [signing-smoke-iv-20260916]
    paths-ignore: ['E2E/**']

permissions:
  contents: read

concurrency:
  group: isolated-windows-signing-probe
  cancel-in-progress: false

jobs:
  probe:
    name: One inert EXE, at most one signature, no publication
    if: github.repository == 'MONTBRAIN/vadgr' && github.ref == 'refs/heads/signing-smoke-iv-20260916' && github.run_attempt == 1
    environment: release-windows
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17.0.20+8'
      - name: Prepare and test without credentials
        shell: pwsh
        run: scripts/signing/smoke.ps1 -Mode prepare
      - name: Sign one inert EXE and verify its independent publisher identity
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          EXPECTED_CERT_SHA256: 2DBA70DB8174B6FAB9002ED906C0076E5321C5BE82C9B4B6C1775456FEF90D22
          EXPECTED_CERT_SUBJECT: CN=Victor Santiago Montaño Diaz,O=Victor Santiago Montaño Diaz,L=Pasto,ST=Nariño,C=CO
          APPROVED_SIGNATURE_COUNT: '1'
        run: scripts/signing/smoke.ps1 -Mode sign
