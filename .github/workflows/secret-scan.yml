name: secret-scan

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]
  push:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Reject credentials in commits and GitHub text
        shell: bash
        run: |
          ARGS=(--event-file "$GITHUB_EVENT_PATH")
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ARGS+=(--git-range "${{ github.event.pull_request.base.sha }}..${{ github.sha }}")
          elif [ "${{ github.event_name }}" = "push" ]; then
            ARGS+=(--git-range "${{ github.event.before }}..${{ github.sha }}")
          fi
          python3 scripts/check_no_secrets.py "${ARGS[@]}"

  # The gate itself had no test and ran on one operating system, so its Windows
  # DACL control was never executed anywhere. It refused every file it was given
  # for as long as that lasted, and nothing reported it.
  gate-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Test the credential gate
        run: python -m pytest scripts/tests -q
