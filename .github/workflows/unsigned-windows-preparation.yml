name: Prepare unsigned Windows legal observations

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Exact same-repository feature branch
        required: true
        default: feature/0.5.0-distribution
        type: string
      source_sha:
        description: Exact 40-character feature commit with successful required checks
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: unsigned-windows-preparation-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  build:
    name: build-unsigned-${{ matrix.architecture }}
    if: github.repository == 'MONTBRAIN/vadgr' && github.ref == 'refs/heads/master' && github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
            runner_arch: X64
            python_arch: x64
            profile: windows-x86_64
            target: x86_64-pc-windows-msvc
          - architecture: arm64
            runner: windows-11-arm
            runner_arch: ARM64
            python_arch: arm64
            profile: windows-aarch64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
      pull-requests: read
    env:
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          path: source_checkout
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - name: Admit exact source as data and materialize the build tree
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RUNNER_ARCH -ne '${{ matrix.runner_arch }}') { throw 'Native runner architecture differs.' }
          python scripts/unsigned_windows_prep.py admit --source-root source_checkout --branch "$env:SOURCE_BRANCH" --source-sha "$env:SOURCE_SHA" --out preparation-source.json --materialize source
          if ($LASTEXITCODE -ne 0) { throw 'Unsigned source admission failed.' }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.target }}
          toolchain: 1.97.1
      - name: Materialize the reviewed profile wheelhouse with read-only access
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/cua_wheelhouse.py --source source --target '${{ matrix.target }}' --release-profile '${{ matrix.profile }}' --out "$env:RUNNER_TEMP/reviewed-wheelhouse"
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed profile materialization failed.' }
      - name: Compile and assemble unsigned review inputs without credentials
        shell: pwsh
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          scripts/candidate/prepare-unsigned-windows.ps1 -Architecture '${{ matrix.architecture }}' -SourceDirectory source -SourceTestDirectory source_checkout -OutputDirectory raw -WheelhouseDirectory "$env:RUNNER_TEMP/reviewed-wheelhouse" -SourceRecord preparation-source.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unapproved-windows-preparation-raw-${{ matrix.architecture }}
          path: raw/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  observe:
    if: github.repository == 'MONTBRAIN/vadgr' && github.ref == 'refs/heads/master' && github.run_attempt == 1
    needs: build
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
      pull-requests: read
    env:
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          path: source_checkout
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unapproved-windows-preparation-raw-${{ matrix.architecture }}
          path: raw
      - name: Independently measure unsigned bytes as data on a fresh runner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/unsigned_windows_prep.py observe --source-root source_checkout --branch "$SOURCE_BRANCH" --source-sha "$SOURCE_SHA" --raw raw --architecture '${{ matrix.architecture }}' --out observations
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unapproved-windows-preparation-${{ matrix.architecture }}
          path: observations/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
