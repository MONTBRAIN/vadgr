name: Reproduce offline release verifier

on:
  push:
    branches: [feature/0.5.0-distribution]
    paths:
      - .github/workflows/verifier-reproducibility.yml
      - Cargo.toml
      - Cargo.lock
      - src/**
      - packaging/release-trusted-root.jsonl
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    name: verifier-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action pinned 2026-09-02
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - name: Build twice from exact source and compare bytes
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          ARCHITECTURE: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=1609459200
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=/vadgr-source"
          mkdir -p out
          for pass in one two; do
            export CARGO_TARGET_DIR="$RUNNER_TEMP/verifier-$pass"
            cargo build --locked --release --features release-verifier \
              --target "$TARGET_TRIPLE" --bin vadgr-release-verify
            cp "$CARGO_TARGET_DIR/$TARGET_TRIPLE/release/vadgr-release-verify" "out/verifier-$pass"
          done
          cmp --silent out/verifier-one out/verifier-two
          cp out/verifier-one "out/vadgr-release-verify-$ARCHITECTURE"
          sha256sum "out/vadgr-release-verify-$ARCHITECTURE" > "out/verifier-$ARCHITECTURE.sha256"
          test "$(uname -m)" = "$ARCHITECTURE"
          "out/vadgr-release-verify-$ARCHITECTURE" --help >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-verifier-${{ matrix.arch }}
          path: |
            out/vadgr-release-verify-${{ matrix.arch }}
            out/verifier-${{ matrix.arch }}.sha256
          if-no-files-found: error
          retention-days: 14
