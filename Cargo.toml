[package]
name = "vadgr-daemon"
version = "0.4.12"
edition = "2024"
description = "The vadgr machine daemon"

[lib]
name = "vadgr_daemon"
path = "src/lib.rs"

# The CLI is a binary in this crate rather than a second crate, so it depends on
# `transport` directly. That is what turns `service.py`'s cross-package import of
# `api.transport` into a shared module instead of a duplicated address
# computation.
# The command a person types is `vadgr`, so that is what the crate builds. It was
# `vadgr-cli` while a launcher script owned the name; nothing owns it now.
[[bin]]
name = "vadgr"
path = "src/cli/main.rs"

[dependencies]
# The CLI's surface. `anstyle` is declared because Rust requires a direct
# dependency to import it, but it adds nothing to the compiled tree: `clap`
# already brings it, and `anstream` rides clap's default colour feature.
# `anstream` is what actually strips colour when the stream is not a terminal.
# `anstyle` only describes a style; printing it through `std::println!` writes the
# escapes unconditionally, which leaked into piped output until this was caught by
# driving the CLI rather than by a unit test.
anstream = "1.0"
# The run stream consumer, replacing `websockets`. `futures-util` is already here.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
anstyle = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
# The two tables the CLI draws are padded columns with no box, which is the
# shape this CLI has always drawn. `unicode-width` is what makes a wide character
# and a coloured status land in the right column; it arrived with comfy-table
# before, so this is a swap that removes a dependency rather than adding one.
unicode-width = "0.2"
indicatif = "0.18"
# `console` arrives with `indicatif` and is declared only because Rust requires
# a direct dependency to import a crate. It reads a line and reads a secret line
# on all four platforms, which is why the prompts add no crate of their own.
console = "0.16"
qrcode-generator = "6.0"

axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["trace"] }
# Bundled so the four platforms stop each bringing their own SQLite. This
# removes a platform variable from the migration; it does not touch a column,
# which is what the schema freeze actually forbids.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml is unmaintained and its own release is tagged "+deprecated".
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
sha2 = "0.11"
rand = "0.10"
futures-util = "0.3"
anyhow = "1"
hostname = "0.4"
async-trait = "0.1"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls", "stream"] }
flate2 = "1"
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
rustls = { version = "0.23", default-features = false }
webpki-roots = "1"
rmcp = { version = "3.1", default-features = false, features = ["client", "transport-child-process"] }
thiserror = "2"
tokio-util = "0.7"
base64 = "0.23"
directories = "6"
url = "2.5"
# The built-in transport. Pinned at or above 1.0.2, the release that closed a
# pre-authentication denial of service in the relay parser; an iroh release
# note is read on every bump.
# tls-aws-lc-rs instead of the default tls-ring: the rest of this tree
# (reqwest through hyper-rustls) already compiles rustls with aws-lc-rs, and
# rustls refuses to pick a process provider when two are enabled.
iroh = { version = ">=1.0.2, <2", default-features = false, features = ["tls-aws-lc-rs", "metrics", "portmapper", "fast-apple-datapath"] }
# Serving axum over a QUIC stream: hyper drives one HTTP/1.1 connection per
# accepted bidirectional stream, with upgrades so the run WebSocket rides a
# stream like any request. hyper-util adapts tokio IO and tower services.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# The port-search test needs a socket that is bound but not accepting, which is
# the state that made the old connect probe lie. std cannot express it.
libc = "0.2"
http-body-util = "0.1"
tempfile = "3"
