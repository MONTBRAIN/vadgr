name: secret-scan

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]
  push:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Reject credentials in commits and GitHub text
        shell: bash
        run: |
          ARGS=(--event-file "$GITHUB_EVENT_PATH")
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ARGS+=(--git-range "${{ github.event.pull_request.base.sha }}..${{ github.sha }}")
          elif [ "${{ github.event_name }}" = "push" ]; then
            ARGS+=(--git-range "${{ github.event.before }}..${{ github.sha }}")
          fi
          python3 scripts/check_no_secrets.py "${ARGS[@]}"
